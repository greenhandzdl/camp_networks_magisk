name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  # ============================================================
  # Job 1: 构建 Kivy APK（使用官方 Docker 镜像加速）
  # ============================================================
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest
      options: --user root
    env:
      BUILDOZER_WARN_ON_ROOT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache buildozer global (SDK/NDK/recipes)
        uses: actions/cache@v4
        with:
          path: /github/home/.buildozer
          key: buildozer-global-v2-${{ hashFiles('drcom-wlan-login/system/bin/android_app/buildozer.spec') }}
          restore-keys: buildozer-global-v2-

      - name: Cache p4a source
        uses: actions/cache@v4
        with:
          path: drcom-wlan-login/system/bin/android_app/p4a-source
          key: p4a-v2024.01.21

      - name: Restore p4a build cache from latest artifact
        uses: dawidd6/action-download-artifact@v7
        continue-on-error: true
        with:
          name: p4a-build-cache
          path: drcom-wlan-login/system/bin/android_app/.buildozer/android
          workflow: release.yml
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Extract p4a build cache
        run: |
          EXTRACT_DIR="drcom-wlan-login/system/bin/android_app/.buildozer/android"
          mkdir -p "$EXTRACT_DIR"
          ZIP="$EXTRACT_DIR/p4a-build-cache.zip"
          if [ -f "$ZIP" ]; then
            SIZE=$(du -h "$ZIP" | cut -f1)
            echo "Found cache zip: $SIZE"
            cd "$EXTRACT_DIR"
            unzip -q -o p4a-build-cache.zip
            rm -f p4a-build-cache.zip
            cd - >/dev/null
            PLATFORM="$EXTRACT_DIR/platform"
            if [ -d "$PLATFORM" ]; then
              echo "Cache restored! Size: $(du -sh "$PLATFORM" | cut -f1)"
              echo "Contents:" && ls "$PLATFORM/" | head -10
            else
              echo "WARNING: platform dir not found after extraction"
              find "$EXTRACT_DIR" -maxdepth 2 -type d | head -10
            fi
          else
            echo "No cache zip found — will do a cold build"
          fi

      - name: Read module.prop version
        id: prop
        run: |
          VERSION=$(grep '^version=' drcom-wlan-login/module.prop | cut -d= -f2)
          VERSION_CODE=$(grep '^versionCode=' drcom-wlan-login/module.prop | cut -d= -f2)
          VERSION_NAME="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versionName=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Pre-clone p4a stable release
        run: |
          # buildozer 默认克隆 master 分支，其 Python 3.14 有 pip 兼容问题
          # 预克隆 v2024.01.21 稳定版到 android_app/p4a-source
          # buildozer.spec 通过 p4a.source_dir=./p4a-source 指向 (相对于 buildozer 运行目录)
          P4A_SOURCE="drcom-wlan-login/system/bin/android_app/p4a-source"
          if [ -d "$P4A_SOURCE" ] && [ -f "$P4A_SOURCE/setup.py" ]; then
            echo "p4a source already exists, skipping..."
          else
            rm -rf "$P4A_SOURCE"
            git clone -b v2024.01.21 --depth 1 https://github.com/kivy/python-for-android.git "$P4A_SOURCE"
            echo "p4a v2024.01.21 cloned"
          fi
          cd "$P4A_SOURCE" && git log --oneline -1

      - name: Prepare APK build
        run: |
          APP_DIR="drcom-wlan-login/system/bin/android_app/app"
          CORE_SRC="drcom-wlan-login/system/bin/python_vers/drcom_core.py"
          cp "$CORE_SRC" "$APP_DIR/drcom_core.py"
          VERSION_NAME="${{ steps.prop.outputs.versionName }}"
          VERSION_CODE="${{ steps.prop.outputs.versionCode }}"
          SPEC="drcom-wlan-login/system/bin/android_app/buildozer.spec"
          sed -i "s|^version = .*|version = $VERSION_NAME|" "$SPEC"
          cat > "$APP_DIR/version.py" <<EOF
          __version__ = "$VERSION_NAME"
          __version_code__ = $VERSION_CODE
          EOF
          echo "Version injected: $VERSION_NAME (code=$VERSION_CODE)"

      - name: Fix SDK licenses and tools
        run: |
          SDK_DIR="/github/home/.buildozer/android/platform/android-sdk"
          # 直接创建 license 哈希文件（SDK 可能未预装时需要）
          LICENSE_DIR="$SDK_DIR/licenses"
          mkdir -p "$LICENSE_DIR"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$LICENSE_DIR/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$LICENSE_DIR/android-sdk-preview-license"
          echo -e "\nd975f751698a77e662f1cd748a47e097b8cf5e8" > "$LICENSE_DIR/intel-android-extra-license"
          # 预装 commandlinetools（p4a 需要 tools/bin/sdkmanager）
          if [ ! -x "$SDK_DIR/tools/bin/sdkmanager" ] && [ ! -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_DIR/cmdline-tools"
            export SDK_DIR
            python3 -c "import urllib.request,zipfile,shutil,os,tempfile;t=tempfile.mkdtemp();z=os.path.join(t,'c.zip');urllib.request.urlretrieve('https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip',z);e=os.path.join(t,'e');zipfile.ZipFile(z).extractall(e);shutil.move(os.path.join(e,'cmdline-tools'),os.path.join(os.environ['SDK_DIR'],'cmdline-tools','latest'));shutil.rmtree(t)"
            chmod -R +x "$SDK_DIR/cmdline-tools/latest/bin/"
          fi
          # tools -> cmdline-tools/latest 符号链接
          if [ -d "$SDK_DIR/cmdline-tools/latest" ]; then
            if [ -d "$SDK_DIR/tools" ] && [ ! -L "$SDK_DIR/tools" ]; then
              rm -rf "$SDK_DIR/tools"
            fi
            ln -sfn "$SDK_DIR/cmdline-tools/latest" "$SDK_DIR/tools"
          fi
          find "$SDK_DIR" -name sdkmanager -type f -exec chmod +x {} \; 2>/dev/null || true
          echo "SDK setup complete"

      - name: Setup APK signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "Decoding release keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > /tmp/release.keystore
            echo "P4A_RELEASE_KEYSTORE=/tmp/release.keystore" >> "$GITHUB_ENV"
            echo "P4A_RELEASE_KEYALIAS=drcom" >> "$GITHUB_ENV"
            echo "P4A_RELEASE_KEYSTORE_PASSWD=${{ secrets.ANDROID_KEYSTORE_PASSWD }}" >> "$GITHUB_ENV"
            echo "P4A_RELEASE_KEYALIAS_PASSWD=${{ secrets.ANDROID_KEYSTORE_PASSWD }}" >> "$GITHUB_ENV"
            echo "Signing configured (release mode)"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set, using debug signing"
          fi

      - name: Build APK
        working-directory: drcom-wlan-login/system/bin/android_app
        run: |
          if [ -n "$P4A_RELEASE_KEYSTORE" ]; then
            buildozer android release
          else
            buildozer android debug
          fi

      - name: Rename APK
        id: apk
        run: |
          VERSION="${{ steps.prop.outputs.version }}"
          APK=$(find drcom-wlan-login/system/bin/android_app/bin -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found"
            ls -la drcom-wlan-login/system/bin/android_app/bin/ || true
            exit 1
          fi
          APK_NAME="DrCOM-WLAN-${VERSION}.apk"
          cp "$APK" "$APK_NAME"
          echo "path=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "APK built: $APK_NAME ($(du -h "$APK_NAME" | cut -f1))"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Save p4a build cache as artifact
        run: |
          PLATFORM_DIR="drcom-wlan-login/system/bin/android_app/.buildozer/android/platform"
          if [ -d "$PLATFORM_DIR" ]; then
            echo "Saving p4a build cache..."
            echo "Size: $(du -sh "$PLATFORM_DIR" | cut -f1)"
            cd "drcom-wlan-login/system/bin/android_app/.buildozer/android"
            zip -r -q /tmp/p4a-build-cache.zip platform/
            echo "Compressed: $(du -sh /tmp/p4a-build-cache.zip | cut -f1)"
            cd - >/dev/null
          else
            echo "No platform dir to cache"
          fi

      - name: Upload p4a build cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: p4a-build-cache
          path: /tmp/p4a-build-cache.zip
          retention-days: 7
          overwrite: true

  # ============================================================
  # Job 2: 构建 Magisk 模块 zip（内嵌 APK）+ 发布 Release
  # ============================================================
  build:
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read module.prop version
        id: prop
        run: |
          VERSION=$(grep '^version=' drcom-wlan-login/module.prop | cut -d= -f2)
          NAME=$(grep '^name=' drcom-wlan-login/module.prop | cut -d= -f2)
          VERSION_CODE=$(grep '^versionCode=' drcom-wlan-login/module.prop | cut -d= -f2)
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "RELEASE_NAME=$NAME $VERSION" >> "$GITHUB_ENV"
          echo "REPO=${{ github.repository }}" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: drcom-wlan-login/apk

      - name: Rename APK to standard name
        run: |
          APK=$(find drcom-wlan-login/apk -name "*.apk" -type f | head -1)
          if [ -n "$APK" ] && [ "$APK" != "drcom-wlan-login/apk/DrCom.apk" ]; then
            mv "$APK" drcom-wlan-login/apk/DrCom.apk
          fi
          # 复制一份到根目录用于 Release 发布
          VERSION="${{ steps.prop.outputs.version }}"
          cp drcom-wlan-login/apk/DrCom.apk "DrCOM-WLAN-${VERSION}.apk"
          echo "APK embedded:"
          ls -lh drcom-wlan-login/apk/
          ls -lh DrCOM-WLAN-*.apk

      - name: Build Magisk Module ZIP
        run: |
          cd drcom-wlan-login
          zip -r ../drcom-wlan-login.zip . \
            -x '.git*' '*/.git*' '*.pyc' '__pycache__/*' '*/__pycache__/*' \
            '.DS_Store' '*/.DS_Store' \
            'system/bin/android_app/*' 'system/bin/.buildozer/*' \
            'system/bin/python_vers/.venv/*' 'system/bin/python_vers/tests/*'

      - name: Generate update.json
        run: |
          REPO_URL="https://github.com/${{ env.REPO }}"
          TAG="$TAG_NAME"
          cat > update.json << EOF
          {
            "version": "${{ steps.prop.outputs.version }}",
            "versionCode": ${{ steps.prop.outputs.versionCode }},
            "zipUrl": "${REPO_URL}/releases/download/${TAG}/drcom-wlan-login.zip",
            "changelog": "${REPO_URL}/releases/tag/${TAG}"
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ env.RELEASE_NAME }}"
          body: |
            ## 变更内容

            请查看 [提交记录](https://github.com/${{ env.REPO }}/commits) 获取详细变更。

            ### 安装方式

            **方式一：Magisk 模块（推荐，需 root）**
            1. 下载下方 `drcom-wlan-login.zip`
            2. 在 Magisk Manager 中选择「从本地安装」
            3. 刷入后重启；模块会自动安装内嵌的 APK
            4. 或在 Magisk 模块页点击 action 按钮安装/更新 APK

            **方式二：独立 APK（无 root 可用）**
            1. 下载下方 `DrCOM-WLAN-*.apk`
            2. 直接安装使用（本地模式，复用认证核心代码）

            > Magisk Manager 已集成自动更新检测，有新版本时会在模块页面显示更新按钮。
          files: |
            drcom-wlan-login.zip
            DrCOM-WLAN-*.apk
            update.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 将 update.json 同步到 main 分支（APK 版本检测依赖此文件）
      # 使用 GitHub API 直接更新，避免 tag ref 下 git checkout 的复杂性
      - name: Sync update.json to main branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$TAG_NAME"
          REPO="${{ env.REPO }}"
          SHA=$(gh api repos/$REPO/contents/update.json?ref=main --jq .sha)
          CONTENT=$(base64 -w0 update.json 2>/dev/null || base64 < update.json)
          gh api -X PUT repos/$REPO/contents/update.json \
            -f message="chore: sync update.json for ${TAG} [skip ci]" \
            -f content="$CONTENT" \
            -f branch=main \
            -f sha="$SHA" \
            --jq '.commit.sha' || echo "Warning: failed to sync update.json"

      # 必须放在最后：切换分支会清理工作区文件
      - name: Publish zip and apk to releases branch (jsDelivr CDN 加速)
        run: |
          TAG="$TAG_NAME"
          NEW_ZIP="/tmp/${TAG}.zip"
          NEW_APK=$(find . -maxdepth 2 -name "DrCOM-WLAN-*.apk" -type f | head -1)
          cp drcom-wlan-login.zip "$NEW_ZIP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 1. 备份已有 releases 分支的所有资产（zip + apk，保留历史版本）
          BACKUP_DIR="/tmp/releases_backup"
          mkdir -p "$BACKUP_DIR"
          git fetch origin releases --depth 1 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/releases; then
            for f in $(git ls-tree --name-only origin/releases | grep -E '\.(zip|apk)$'); do
              git show "origin/releases:$f" > "$BACKUP_DIR/$f"
            done
          fi
          # 加入本次新 zip + apk + 更新 latest
          cp "$NEW_ZIP" "$BACKUP_DIR/${TAG}.zip"
          cp "$NEW_ZIP" "$BACKUP_DIR/latest.zip"
          if [ -n "$NEW_APK" ]; then
            cp "$NEW_APK" "$BACKUP_DIR/$(basename "$NEW_APK")"
            cp "$NEW_APK" "$BACKUP_DIR/latest.apk"
          fi

          # 2. 重建 orphan 分支（始终只有 1 个 commit，无历史）
          git checkout --orphan releases
          git rm -rf --cached . >/dev/null 2>&1 || true
          git clean -fd >/dev/null 2>&1 || true
          cp "$BACKUP_DIR"/* .
          git add *.zip *.apk 2>/dev/null || git add *.zip
          git commit -m "release: ${TAG}"
          git push --force origin releases

      # 最终：多次刷新 jsDelivr CDN 缓存（边缘节点缓存顽固，单次 purge 不够）
      - name: Purge jsDelivr CDN cache (retry)
        run: |
          TAG="$TAG_NAME"
          REPO="${{ env.REPO }}"
          for round in 1 2 3; do
            echo "=== Purge round $round ==="
            for path in "@main/update.json" "@releases/latest.zip" "@releases/${TAG}.zip" "@releases/latest.apk"; do
              status=$(curl -s "https://purge.jsdelivr.net/gh/${REPO}${path}" | python3 -c "import json,sys;d=json.load(sys.stdin);p=d.get('paths',{});k=list(p.keys())[0] if p else '';print('throttled' if p.get(k,{}).get('throttled') else 'ok')" 2>/dev/null || echo "error")
              echo "  ${path}: ${status}"
            done
            [ $round -lt 3 ] && sleep 15
          done
          echo "=== Verify ==="
          curl -sL "https://cdn.jsdelivr.net/gh/${REPO}@main/update.json" | python3 -c "import json,sys;d=json.load(sys.stdin);print(f\"CDN: {d['version']} code={d['versionCode']}\")"
